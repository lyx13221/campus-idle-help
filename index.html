<style>
  :root { --g:#3E9C6E; --ink:#1F2A24; --line:#E4EAE5; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:"Microsoft YaHei",system-ui,sans-serif;
         background:#0e1512; color:#e9f0eb; display:flex; min-height:100vh; }

  /* 桌面：左侧导航 */
  .side { width:250px; padding:22px 16px; border-right:1px solid #1d2a24;
          background:#0b1210; flex-shrink:0; }
  .side h1 { font-size:15px; margin:0 0 4px; letter-spacing:.5px; }
  .side p { font-size:11.5px; color:#7f948b; margin:0 0 14px; line-height:1.7; }
  .navbtn { display:block; width:100%; text-align:left; padding:9px 11px; margin-bottom:6px;
            background:#111c18; color:#b9c9c1; border:1px solid #1d2a24; border-radius:9px;
            font-size:12.5px; cursor:pointer; font-family:inherit; transition:.15s; }
  .navbtn:hover { border-color:#2e4a3c; color:#dfeae3; }
  .navbtn.on { background:rgba(62,156,110,.16); border-color:var(--g); color:#8fe0b5; }
  .tip { font-size:10.5px; color:#5f7369; line-height:1.8; margin-top:14px; }
  .tip b { color:#8fe0b5; }

  .stage { flex:1; display:flex; align-items:center; justify-content:center; padding:20px; }

  /* 手机框：宽高与 SVG 完全一致，热区才不会错位 */
  .phone { position:relative; width:390px; height:844px; border-radius:42px;
           background:#0a0a0a; padding:0; overflow:hidden;
           box-shadow:0 30px 80px rgba(0,0,0,.55); }
  .viewport { position:absolute; inset:0; overflow:hidden; background:#F6F8F6; }

  .screen { position:absolute; inset:0; display:none; }
  .screen.on { display:block; }

  /* SVG 铺满整屏，坐标 1:1 */
  .art { position:absolute; inset:0; }
  .art svg { width:390px; height:844px; display:block; }

  /* 热区 */
  .hs { position:absolute; display:block; border-radius:10px; cursor:pointer;
        touch-action:manipulation; }
  .hs:hover { background:rgba(62,156,110,.10); outline:1px dashed rgba(62,156,110,.5); }
  .hs:active { background:rgba(62,156,110,.18); }

  /* 点击涟漪 + 提示条 */
  .ripple { position:absolute; width:26px; height:26px; margin:-13px 0 0 -13px;
            border-radius:50%; background:rgba(62,156,110,.45); pointer-events:none;
            animation:rp .5s ease-out forwards; z-index:60; }
  @keyframes rp { to { transform:scale(2.6); opacity:0; } }
  .toast { position:absolute; left:50%; bottom:110px; transform:translate(-50%,10px);
           background:rgba(15,26,21,.9); color:#dff0e7; font-size:12.5px; padding:8px 16px;
           border-radius:999px; opacity:0; transition:.25s; pointer-events:none; z-index:70;
           white-space:nowrap; }
  .toast.show { opacity:1; transform:translate(-50%,0); }

  /* 手机端：隐藏侧栏，等比缩放，底部圆点翻页 */
  .dock { position:fixed; left:50%; bottom:14px; transform:translateX(-50%);
          display:none; gap:9px; z-index:99; padding:8px 12px; border-radius:999px;
          background:rgba(10,18,16,.62); backdrop-filter:blur(6px); }
  .dock i { width:8px; height:8px; border-radius:99px; background:#6b7f75;
            display:block; cursor:pointer; transition:.2s; }
  .dock i.on { width:22px; background:#8fe0b5; }

  @media (max-width: 900px) {
    body { display:block; overflow:hidden; }
    .side { display:none; }
    .stage { padding:0; height:100vh; overflow:hidden; }
    .dock { display:flex; }
  }
</style>
</head>

<div class="dock" id="dock"></div>

<script>
  const screens = [...document.querySelectorAll('.screen')];
  const navbtns = [...document.querySelectorAll('.navbtn')];
  const dock = document.getElementById('dock');
  const toast = document.getElementById('toast');
  const viewport = document.getElementById('viewport');
  const LABEL = {};
  screens.forEach(s => { LABEL[s.id] = s.dataset.title; });
  let idx = 0;

  function flash(x, y) {
    const r = document.createElement('div');
    r.className = 'ripple';
    r.style.left = x + 'px';
    r.style.top = y + 'px';
    viewport.appendChild(r);
    setTimeout(() => r.remove(), 520);
  }

  function toastShow(text) {
    toast.textContent = text;
    toast.classList.add('show');
    clearTimeout(toastShow._t);
    toastShow._t = setTimeout(() => toast.classList.remove('show'), 1200);
  }

  function show(name, opts) {
    let i = screens.findIndex(s => s.id === name);
    if (i < 0) i = 0;
    screens.forEach((s, k) => s.classList.toggle('on', k === i));
    navbtns.forEach((b, k) => b.classList.toggle('on', k === i));
    [...dock.children].forEach(d => d.classList.toggle('on', d.dataset.to === name));
    idx = i;
    if (!opts || !opts.silent) toastShow('→ ' + (LABEL[name] || name));
  }

  // 点高亮区跳转
  document.querySelectorAll('.hs').forEach(h => {
    h.addEventListener('click', e => {
      e.stopPropagation();
      const go = h.dataset.go;
      const box = viewport.getBoundingClientRect();
      flash(e.clientX - box.left, e.clientY - box.top);
      if (go === 'back') { show('01-home'); return; }
      show(go);
    });
  });

  // 点画面其它地方也给反馈（证明整页有响应，而不是死的）
  viewport.addEventListener('click', e => {
    const box = viewport.getBoundingClientRect();
    flash(e.clientX - box.left, e.clientY - box.top);
  });

  navbtns.forEach(b => b.addEventListener('click', () => show(b.dataset.to)));

  screens.forEach(s => {
    const d = document.createElement('i');
    d.dataset.to = s.id;
    d.title = s.dataset.title;
    d.addEventListener('click', () => show(s.id));
    dock.appendChild(d);
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') show(screens[Math.min(idx + 1, screens.length - 1)].id);
    if (e.key === 'ArrowLeft') show(screens[Math.max(idx - 1, 0)].id);
  });

  function fit() {
    const phone = document.querySelector('.phone');
    const stage = document.querySelector('.stage');
    if (window.innerWidth <= 900) {
      const scale = Math.min(1, (window.innerWidth - 4) / 390, (window.innerHeight - 30) / 844);
      phone.style.transformOrigin = 'top center';
      phone.style.transform = 'scale(' + scale + ')';
      stage.style.height = (844 * scale + 8) + 'px';
      stage.style.alignItems = 'flex-start';
      stage.style.paddingTop = '4px';
    } else {
      phone.style.transform = 'none';
      stage.style.height = '';
      stage.style.alignItems = 'center';
      stage.style.paddingTop = '';
    }
  }
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);
  fit();
  show('01-home', { silent: true });
</script>
